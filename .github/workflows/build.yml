name: Build Tulip VPN APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.tulip --project-name tulip_vpn .
          rm -rf test
          bash scripts/patch_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons (Tulip logo)
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Tulip-VPN.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Tulip-VPN-apk
          path: dist/Tulip-VPN.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tulip-VPN.apk
